<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
>

<h:head>
    <title><ui:insert name="title">Petshop</ui:insert></title>

<!--    Primeflex-->
    <h:outputStylesheet library="webjars" name="primeflex/4.0.0/primeflex.min.css"/>
</h:head>

<h:body styleClass="surface-ground text-color m-0">
    <h:form id="frmmenu">
        <nav class="menu-bar">
            <p:menubar styleClass="flex">
                <div>
                <p:submenu label="Animais" >
                    <p:menuitem value="Novo Animal" outcome="/index.xhtml"/>
                    <p:menuitem value="Relação Animais" outcome="/index.xhtml"/>
                    <p:menuitem value="Relação Donos" outcome="/index.xhtml"/>
                </p:submenu>

                <p:submenu label="Consultas" >
                    <p:menuitem value="Nova Consulta" outcome="/index.xhtml" />
                    <p:menuitem value="Calendário Consultas" outcome="/index.xhtml" />
                    <p:menuitem value="Histórico Consultas" outcome="/index.xhtml" />
                </p:submenu>

                <p:submenu label="Funcionários" >
                    <p:menuitem value="Novo Veterinário" outcome="/index.xhtml" />
                </p:submenu>
                </div>
                <!-- logout opcional na menubar -->
                <p:menuitem
                        icon="fa fas fa-sign-out-alt"
                        iconPos="right"
                        styleClass="f-right"
                        value="Sair"
                        process="@this"
                        immediate="true"
                        update="@none"
                        containerStyleClass="f-right" />
            </p:menubar>
        </nav>
    </h:form>

    <main class="w-full p-5 md:p-6">
        <ui:insert name="content"/>
    </main>
</h:body>
</html>
