<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"

>

<h:head>
    <title><ui:insert name="title">Petshop</ui:insert></title>
    <h:outputStylesheet library="webjars" name="primeflex/4.0.0/primeflex.min.css"/>
</h:head>

<h:body styleClass="surface-ground text-color m-0">
    <div class="card">
        <h:form styleClass="items-center">
            <p:growl id="messages"/>
            <p:menubar hideDelay="1000">
                <f:facet name="start">
                     <!-- Aqui eu também poderia estilizar com o primeflex pra colocar as classes de responsividade -->
                    <p:graphicImage library="images" name="sesc_logo.svg" alt="Logo Sesc" width="60" height="30"/>
                </f:facet>

                <p:menuitem value="Consultas" icon="pi pi-calendar pi-align-left" url="/pages/consultas.xhtml"/>
                <p:menuitem value="Pacientes" icon="pi pi-user-plus" url="/pages/pacientes.xhtml"/>
                <p:menuitem value="Veterinários" icon="pi pi-plus-circle" url="/pages/veterinarios.xhtml"/>

                <f:facet name="end">
                    <p:button value="Logout" icon="pi pi-fw pi-sign-out" styleClass="ui-button-info"/>
                </f:facet>
            </p:menubar>
        </h:form>
    </div>

    <main class="w-full p-5 md:p-6">
        <ui:insert name="content"/>
    </main>
</h:body>
</html>
