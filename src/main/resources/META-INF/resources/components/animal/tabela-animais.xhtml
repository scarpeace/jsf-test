<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<cc:interface>
    <cc:attribute name="bean" type="scarpellini.jsf_test.web.beans.AnimalBean" required="true" />
    <cc:attribute name="styleClass" default="" />
</cc:interface>

<cc:implementation>
    <div class="#{cc.attrs.styleClass}">
        <p:panel header="Animais cadastrados"
                 styleClass="border-1 border-solid border-gray-200 border-round-lg mb-4 p-3 h-full">
            <h:form id="formulario">
                <p:dataTable id="tabela" value="#{cc.attrs.bean.animais}" var="animal"
                             emptyMessage="Nenhum animal cadastrado."
                             responsiveLayout="scroll" rowHover="true">
                    <p:column headerText="Animal">
                        <h:outputText value="#{animal.nome}" />
                    </p:column>

                    <p:column headerText="Espécie">
                        <h:outputText value="#{animal.especie.descricao}" />
                    </p:column>

                    <p:column headerText="Raça">
                        <h:outputText value="#{animal.raca}" />
                    </p:column>

                    <p:column headerText="Nascimento">
                        <h:outputText value="#{animal.dataNascimento}" />
                    </p:column>

                    <p:column headerText="Dono">
                        <h:outputText value="#{animal.nomeDono}" />
                    </p:column>

                    <p:column headerText="Ações" styleClass="white-space-nowrap">
                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         styleClass="ui-button-text"
                                         action="#{cc.attrs.bean.editar(animal.id)}"
                                         update=":cadastroAnimal:formulario"
                                         process="@this" />
                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         styleClass="ui-button-text ui-button-danger"
                                         action="#{cc.attrs.bean.excluir(animal.id)}"
                                         update="@form :cadastroAnimal:formulario"
                                         process="@this">
                            <p:confirm header="Confirmar exclusão"
                                       message="Deseja excluir #{animal.nome}?"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true">
                    <p:commandButton value="Cancelar"
                                     type="button"
                                     styleClass="ui-confirmdialog-no ui-button-flat" />
                    <p:commandButton value="Excluir"
                                     type="button"
                                     styleClass="ui-confirmdialog-yes ui-button-danger" />
                </p:confirmDialog>
            </h:form>
        </p:panel>
    </div>
</cc:implementation>

</html>
