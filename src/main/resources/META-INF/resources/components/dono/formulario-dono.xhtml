<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<cc:interface>
    <cc:attribute name="bean" type="scarpellini.jsf_test.web.beans.DonoBean" required="true" />
    <cc:attribute name="styleClass" default="" />
</cc:interface>

<cc:implementation>
    <div class="#{cc.attrs.styleClass}">
    <p:messages id="mensagens" />

    <p:panel header="Dados do dono"
             styleClass="border-1 border-solid border-gray-200 border-round-lg p-3">
        <h:form id="formulario">
            <div class="grid">
                <div class="col-12 md:col-6">
                    <p:outputLabel for="nome" value="Nome" styleClass="block font-semibold mb-2" />
                    <p:inputText id="nome" value="#{cc.attrs.bean.donoRequest.nome}" styleClass="w-full" />
                </div>

                <div class="col-12 md:col-6">
                    <p:outputLabel for="telefone" value="Telefone" styleClass="block font-semibold mb-2" />
                    <p:inputText id="telefone" value="#{cc.attrs.bean.donoRequest.telefone}" styleClass="w-full" />
                </div>

                <div class="col-12">
                    <p:outputLabel for="email" value="E-mail" styleClass="block font-semibold mb-2" />
                    <p:inputText id="email" value="#{cc.attrs.bean.donoRequest.email}" styleClass="w-full" />
                </div>
            </div>

            <div class="flex flex-column gap-3 mt-3">

                <p:commandButton value="Criar"
                                 icon="pi pi-check"
                                 action="#{cc.attrs.bean.criar}"
                                 rendered="#{empty cc.attrs.bean.donoRequest.id}"
                                 update="@form :lista:formulario :cadastro:mensagens" />
                <p:commandButton value="Atualizar"
                                 icon="pi pi-check"
                                 action="#{cc.attrs.bean.atualizar}"
                                 rendered="#{not empty cc.attrs.bean.donoRequest.id}"
                                 update="@form :lista:formulario :cadastro:mensagens" />

                <p:commandButton value="Limpar"
                                 icon="pi pi-plus"
                                 styleClass="ui-button-outlined"
                                 action="#{cc.attrs.bean.novo}"
                                 rendered="#{not empty cc.attrs.bean.donoRequest.id}"
                                 update="@form :cadastro:mensagens"
                                 process="@this" />
            </div>
        </h:form>
    </p:panel>
    </div>
</cc:implementation>

</html>
