<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<cc:interface>
    <cc:attribute name="bean" type="scarpellini.jsf_test.web.beans.DonoBean" required="true" />
    <cc:attribute name="styleClass" default="" />
</cc:interface>

<cc:implementation>
    <div class="#{cc.attrs.styleClass}">
    <p:panel header="Lista de donos"
             styleClass="border-1 border-solid border-gray-200 border-round-lg mb-4 h-full p-3">
        <h:form id="formulario">
            <p:dataTable id="tabela" value="#{cc.attrs.bean.donos}" var="dono"
                         responsiveLayout="scroll" rowHover="true">
                <p:column headerText="Nome">
                    <h:outputText value="#{dono.nome}" />
                </p:column>

                <p:column headerText="Telefone">
                    <h:outputText value="#{dono.telefone}" />
                </p:column>

                <p:column headerText="E-mail">
                    <h:outputText value="#{dono.email}" />
                </p:column>

                <p:column headerText="Ações" styleClass="white-space-nowrap">
                    <p:commandButton icon="pi pi-pencil"
                                     title="Editar"
                                     styleClass="ui-button-text mr-2"
                                     action="#{cc.attrs.bean.editar(dono)}"
                                     update="@form :cadastro:formulario"
                                     process="@this" />
                    <p:commandButton icon="pi pi-trash"
                                     title="Excluir"
                                     styleClass="ui-button-text ui-button-danger"
                                     action="#{cc.attrs.bean.excluir(dono.id)}"
                                     update="@form :cadastro:formulario"
                                     process="@this" />
                </p:column>
            </p:dataTable>
        </h:form>
    </p:panel>
    </div>
</cc:implementation>

</html>
