<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<cc:interface>
    <cc:attribute name="bean" type="scarpellini.jsf_test.web.beans.DoutorBean" required="true" />
    <cc:attribute name="styleClass" default="" />
</cc:interface>

<cc:implementation>
    <div class="#{cc.attrs.styleClass}">
    <p:messages id="mensagens" />

    <p:panel header="Dados do doutor"
             styleClass="mb-4 p-3 h-full border-1 border-solid border-gray-200 border-round-lg">
        <h:form id="formulario">
            <div class="grid">
                <div class="col-12 md:col-6">
                    <p:outputLabel for="nome" value="Nome" styleClass="block font-semibold mb-2" />
                    <p:inputText id="nome" value="#{cc.attrs.bean.doutor.nome}" styleClass="w-full" />
                </div>

                <div class="col-12 md:col-6">
                    <p:outputLabel for="crmv" value="CRMV" styleClass="block font-semibold mb-2" />
                    <p:inputText id="crmv" value="#{cc.attrs.bean.doutor.crmv}" styleClass="w-full" />
                </div>

                <div class="col-12">
                    <p:outputLabel for="telefone" value="Telefone" styleClass="block font-semibold mb-2" />
                    <p:inputText id="telefone" value="#{cc.attrs.bean.doutor.telefone}" styleClass="w-full" />
                </div>
            </div>

            <div class="flex flex-column gap-3 mt-3">
                <p:commandButton value="Salvar"
                                 icon="pi pi-check"
                                 action="#{cc.attrs.bean.salvar}"
                                 update="@form :listaDoutores:formulario :cadastroDoutor:mensagens" />
                <p:commandButton value="Novo"
                                 icon="pi pi-plus"
                                 styleClass="ui-button-outlined"
                                 action="#{cc.attrs.bean.novo}"
                                 update="@form :cadastroDoutor:mensagens"
                                 process="@this" />
            </div>
        </h:form>
    </p:panel>
    </div>
</cc:implementation>

</html>
