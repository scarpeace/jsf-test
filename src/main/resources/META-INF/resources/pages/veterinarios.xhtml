<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:doutor="jakarta.faces.composite/components/doutor"
                template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Veterinários | Petshop</ui:define>

    <ui:define name="content">
        <div class="mb-4">
            <div class="text-sm font-semibold text-teal-700 mb-2">PETSHOP</div>
            <h1 class="text-4xl font-bold text-teal-800 m-0">Veterinários</h1>
            <p class="text-color-secondary text-lg mt-2 mb-0">
                Cadastre e gerencie os veterinários do petshop.
            </p>
        </div>

        <div class="grid justify-content-between">
            <div class="col-12 lg:col-4">
                <doutor:formulario-doutor id="cadastroDoutor" bean="#{doutorBean}" styleClass="h-full" />
            </div>
            <div class="col-12 lg:col-8">
                <doutor:tabela-doutores id="listaDoutores" bean="#{doutorBean}" styleClass="h-full" />
            </div>
        </div>
    </ui:define>
</ui:composition>
